
name: Update and publish anime playlist

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xray
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

          curl -fL \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -o xray.zip

          unzip -o xray.zip xray
          chmod +x xray

          ./xray version

      - name: Create Xray configuration
        env:
          XRAY_ADDRESS: ${{ secrets.XRAY_ADDRESS }}
          XRAY_PORT: ${{ secrets.XRAY_PORT }}
          XRAY_UUID: ${{ secrets.XRAY_UUID }}
          XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
          XRAY_SERVER_NAME: ${{ secrets.XRAY_SERVER_NAME }}
          XRAY_FINGERPRINT: ${{ secrets.XRAY_FINGERPRINT }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [
                  {
                      "listen": "127.0.0.1",
                      "port": 10809,
                      "protocol": "http",
                      "settings": {}
                  }
              ],
              "outbounds": [
                  {
                      "tag": "proxy",
                      "protocol": "vless",
                      "settings": {
                          "vnext": [
                              {
                                  "address": os.environ["XRAY_ADDRESS"],
                                  "port": int(os.environ["XRAY_PORT"]),
                                  "users": [
                                      {
                                          "id": os.environ["XRAY_UUID"],
                                          "encryption": "none",
                                          "flow": ""
                                      }
                                  ]
                              }
                          ]
                      },
                      "streamSettings": {
                          "network": "tcp",
                          "security": "reality",
                          "realitySettings": {
                              "fingerprint": os.environ["XRAY_FINGERPRINT"],
                              "serverName": os.environ["XRAY_SERVER_NAME"],
                              "publicKey": os.environ["XRAY_PUBLIC_KEY"]
                          }
                      }
                  }
              ]
          }

          with open("xray-config.json", "w") as f:
              json.dump(config, f)
          PY

          ./xray run -test -c xray-config.json

      - name: Start Xray
        run: |
          nohup ./xray run -c xray-config.json > xray.log 2>&1 &
          echo $! > xray.pid

          for i in $(seq 1 20); do
            if curl -s --proxy http://127.0.0.1:10809 \
              --connect-timeout 3 https://api.ipify.org \
              -o /tmp/proxy-ip.txt; then
              break
            fi
            sleep 2
          done

          if [ ! -s /tmp/proxy-ip.txt ]; then
            echo "Xray connection test failed."
            cat xray.log
            exit 1
          fi

          echo "Proxy external IP:"
          cat /tmp/proxy-ip.txt
          echo

          echo "Checking proxy country:"
          curl -fsS --proxy http://127.0.0.1:10809 \
            --connect-timeout 10 --max-time 30 \
            https://ipinfo.io/json

      - name: Capture streams and update playlist
        run: python capture_stream.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anime.m3u

          if git diff --cached --quiet; then
            echo "Playlist has not changed."
          else
            git commit -m "Update anime playlist"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
